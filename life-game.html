<style>
:root {
  --sky: #1a7a4a;
  --sky-light: #22c55e;
  --sky-pale: #dcfce7;
  --navy: #1a3d2b;
  --navy-soft: #1f5c40;
  --bg: #f0fdf4;
  --text: #1e293b;
  --text-light: #64748b;
  --border: #bbf7d0;
  --white: #ffffff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ─── Header (identical to simulation.html) ─── */
header {
  position: sticky; top: 0; z-index: 1000;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(26,122,74,.08);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 24px;
  padding: 0 20px; height: 64px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.logo-main {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--sky) 0%, #4ade80 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.tagline { font-size: 10px; color: var(--text-light); letter-spacing: .05em; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav a {
  padding: 8px 14px; border-radius: 8px; font-size: 13px;
  font-weight: 600; color: var(--text-light);
  transition: background .18s, color .18s;
}
nav a:hover { background: var(--sky-pale); color: var(--sky); }
nav a.active { color: var(--sky); font-weight: 700; }
.btn-cta {
  background: var(--sky); color: #fff;
  padding: 8px 18px; border-radius: 50px;
  font-size: 13px; font-weight: 700;
  transition: background .18s, transform .18s;
  white-space: nowrap;
}
.btn-cta:hover { background: var(--navy); transform: translateY(-1px); }
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span { display: block; width: 22px; height: 2px; background: var(--navy); border-radius: 2px; }
@media(max-width:768px){
  nav { display: none; }
  .btn-cta { display: none; }
  .hamburger { display: flex; }
}

/* ─── Game Hero ─── */
.game-hero {
  background: linear-gradient(135deg, #0f2d1c 0%, #1a4a30 60%, #0f3a27 100%);
  color: #fff; padding: 40px 24px 44px; text-align: center; position: relative; overflow: hidden;
}
.game-hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 30%, rgba(74,222,128,.1) 0%, transparent 60%);
  pointer-events: none;
}
.game-hero-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(74,222,128,.15); border: 1px solid rgba(74,222,128,.35);
  color: #86efac; font-size: 11px; font-weight: 700; letter-spacing: .1em;
  padding: 5px 14px; border-radius: 20px; margin-bottom: 16px;
}
.game-hero h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; line-height: 1.3; margin-bottom: 8px; }
.game-hero p { font-size: 14px; color: rgba(255,255,255,.75); }

/* ─── Main game container ─── */
.game-wrap {
  max-width: 1000px; margin: 0 auto; padding: 24px 16px 80px;
}

/* ─── Player setup ─── */
.setup-panel {
  background: var(--white); border-radius: 20px;
  border: 1.5px solid var(--border);
  padding: 28px 24px; margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(26,122,74,.06);
}
.setup-panel h2 { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 16px; }
.player-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.player-btn {
  padding: 10px 22px; border-radius: 50px; border: 2px solid var(--border);
  background: var(--white); font-size: 14px; font-weight: 700;
  color: var(--text-light); cursor: pointer; transition: all .2s;
}
.player-btn:hover { border-color: var(--sky); color: var(--sky); }
.player-btn.selected { background: var(--sky); border-color: var(--sky); color: #fff; }
.setup-actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-start {
  background: var(--sky); color: #fff; border: none;
  padding: 12px 32px; border-radius: 50px; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: background .2s, transform .2s;
  font-family: inherit;
}
.btn-start:hover { background: var(--navy); transform: translateY(-2px); }
.btn-start:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
.btn-newgame {
  background: transparent; color: var(--sky); border: 2px solid var(--sky);
  padding: 10px 24px; border-radius: 50px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s; font-family: inherit; display: none;
}
.btn-newgame:hover { background: var(--sky-pale); }

/* ─── Player scoreboard ─── */
.scoreboard {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
}
.score-card {
  background: var(--white); border-radius: 16px; border: 2px solid var(--border);
  padding: 14px 18px; flex: 1; min-width: 140px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04); transition: border-color .3s;
}
.score-card.active-turn {
  border-color: var(--sky-light);
  box-shadow: 0 0 0 3px rgba(34,197,94,.2);
}
.score-player-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.score-money { font-size: 1.3rem; font-weight: 900; color: var(--sky); }
.score-money.negative { color: #ef4444; }
.score-pos { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.score-asset-icon { font-size: 18px; }

/* ─── Board ─── */
.board-section {
  background: var(--white); border-radius: 20px; border: 1.5px solid var(--border);
  padding: 20px; margin-bottom: 20px;
  box-shadow: 0 4px 24px rgba(26,122,74,.07);
}
.board-title { font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 16px; letter-spacing: .05em; }
.board-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.square {
  border-radius: 12px;
  border: 2px solid transparent;
  padding: 6px 4px;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  min-height: 64px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  position: relative;
  transition: transform .15s, box-shadow .15s;
  cursor: default;
}
.square-emoji { font-size: 20px; line-height: 1; }
.square-label { font-size: 9px; color: inherit; opacity: .85; }
.square-num { font-size: 8px; opacity: .5; position: absolute; top: 3px; left: 5px; }

/* Square type colors */
.sq-start  { background: #fef9c3; border-color: #fde047; color: #713f12; }
.sq-goal   { background: #fef3c7; border-color: #f59e0b; color: #92400e; animation: goalPulse 2s ease-in-out infinite; }
@keyframes goalPulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)} 50%{box-shadow:0 0 0 6px rgba(245,158,11,0)} }
.sq-job    { background: #dbeafe; border-color: #93c5fd; color: #1e3a8a; }
.sq-marry  { background: #fce7f3; border-color: #f9a8d4; color: #831843; }
.sq-house  { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
.sq-stock  { background: #d1fae5; border-color: #6ee7b7; color: #064e3b; }
.sq-nisa   { background: #e0e7ff; border-color: #a5b4fc; color: #1e1b4b; }
.sq-insurance { background: #f3e8ff; border-color: #d8b4fe; color: #581c87; }
.sq-tax    { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
.sq-bonus  { background: #d1fae5; border-color: #34d399; color: #064e3b; }
.sq-sick   { background: #fee2e2; border-color: #f87171; color: #7f1d1d; }
.sq-skill  { background: #e0f2fe; border-color: #7dd3fc; color: #0c4a6e; }
.sq-lucky  { background: #fef9c3; border-color: #fde047; color: #713f12; }
.sq-rest   { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }

/* Player tokens on square */
.token-row { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.token {
  width: 16px; height: 16px; border-radius: 50%;
  font-size: 11px; display: flex; align-items: center; justify-content: center;
  border: 1.5px solid rgba(255,255,255,.7);
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
}

/* Highlighted current active square */
.square.current-player-here {
  transform: scale(1.08);
  box-shadow: 0 0 0 3px var(--sky-light), 0 4px 16px rgba(34,197,94,.3);
  z-index: 2;
}

/* ─── Dice & Controls ─── */
.dice-section {
  background: var(--white); border-radius: 20px; border: 1.5px solid var(--border);
  padding: 24px; margin-bottom: 20px;
  box-shadow: 0 4px 24px rgba(26,122,74,.07);
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.dice-wrap { display: flex; align-items: center; gap: 16px; }
.dice {
  width: 68px; height: 68px; border-radius: 16px;
  background: var(--white); border: 3px solid var(--navy);
  display: grid; place-items: center;
  font-size: 36px; font-weight: 900;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  user-select: none;
  transition: transform .1s;
}
.dice.rolling {
  animation: diceRoll .5s ease;
}
@keyframes diceRoll {
  0%  { transform: rotate(0deg) scale(1); }
  20% { transform: rotate(-15deg) scale(1.1); }
  40% { transform: rotate(10deg) scale(0.9); }
  60% { transform: rotate(-8deg) scale(1.05); }
  80% { transform: rotate(5deg) scale(0.97); }
  100%{ transform: rotate(0deg) scale(1); }
}
.btn-roll {
  background: var(--sky); color: #fff; border: none;
  padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: background .2s, transform .2s;
  font-family: inherit;
}
.btn-roll:hover:not(:disabled) { background: var(--navy); transform: translateY(-2px); }
.btn-roll:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
.turn-info { flex: 1; }
.turn-name { font-size: 1.1rem; font-weight: 800; color: var(--navy); }
.turn-sub { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* ─── Event Popup ─── */
.popup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: none; place-items: center; z-index: 2000;
  padding: 16px;
}
.popup-overlay.open { display: grid; }
.popup-box {
  background: var(--white); border-radius: 24px;
  max-width: 480px; width: 100%;
  padding: 32px 28px; text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.25);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(.7) translateY(30px); opacity: 0; }
  to   { transform: scale(1) translateY(0);    opacity: 1; }
}
.popup-emoji { font-size: 56px; margin-bottom: 10px; line-height: 1; }
.popup-title { font-size: 1.3rem; font-weight: 900; color: var(--navy); margin-bottom: 10px; }
.popup-result {
  font-size: 1.6rem; font-weight: 900; margin: 10px 0;
}
.popup-result.plus { color: var(--sky); }
.popup-result.minus { color: #ef4444; }
.popup-result.neutral { color: var(--text-light); }
.popup-explain {
  font-size: 13px; color: var(--text-light); line-height: 1.75;
  margin-bottom: 20px; text-align: left;
  background: var(--sky-pale); border-radius: 12px; padding: 14px 16px;
}
.popup-explain strong { color: var(--navy); }
.btn-next {
  background: var(--sky); color: #fff; border: none;
  padding: 13px 36px; border-radius: 50px; font-size: 15px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: background .2s;
}
.btn-next:hover { background: var(--navy); }

/* ─── Final Result ─── */
.result-popup-box {
  background: linear-gradient(135deg, #0f2d1c, #1a4a30);
  color: #fff; border-radius: 24px;
  max-width: 520px; width: 100%;
  padding: 36px 28px; text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.35);
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
.result-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 6px; }
.result-grade {
  font-size: 5rem; font-weight: 900; line-height: 1;
  margin: 14px 0 8px;
}
.grade-S { color: #fde047; text-shadow: 0 0 20px rgba(253,224,71,.5); }
.grade-A { color: #86efac; }
.grade-B { color: #7dd3fc; }
.grade-C { color: #fca5a5; }
.result-money { font-size: 1.4rem; font-weight: 800; color: #86efac; margin-bottom: 16px; }
.result-events {
  text-align: left; background: rgba(255,255,255,.08); border-radius: 14px;
  padding: 16px; margin: 16px 0; max-height: 200px; overflow-y: auto;
  font-size: 12px; line-height: 1.9; color: rgba(255,255,255,.8);
}
.result-events h4 { color: #86efac; font-size: 13px; margin-bottom: 8px; }
.result-grade-msg { font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 20px; }
.result-players { margin-bottom: 20px; }
.result-player-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.08); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 8px;
}
.result-player-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.result-player-money { font-weight: 800; font-size: 15px; }
.result-player-money.pos { color: #86efac; }
.result-player-money.neg { color: #fca5a5; }
.result-player-grade { font-size: 13px; font-weight: 700; }
.btn-result-new {
  background: #4ade80; color: var(--navy); border: none;
  padding: 13px 36px; border-radius: 50px; font-size: 15px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: transform .2s;
}
.btn-result-new:hover { transform: scale(1.04); }

/* ─── Event log ─── */
.log-section {
  background: var(--white); border-radius: 20px; border: 1.5px solid var(--border);
  padding: 20px; margin-bottom: 20px;
  box-shadow: 0 4px 24px rgba(26,122,74,.07);
}
.log-title { font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 10px; }
.log-list {
  max-height: 140px; overflow-y: auto; display: flex; flex-direction: column-reverse;
  gap: 6px;
}
.log-entry {
  font-size: 12px; padding: 7px 12px; border-radius: 8px;
  background: var(--sky-pale); color: var(--navy); display: flex; align-items: center; gap: 6px;
}
.log-entry .log-emoji { font-size: 14px; flex-shrink: 0; }

/* ─── Footer ─── */
footer {
  background: var(--navy); color: rgba(255,255,255,.7);
  text-align: center; padding: 24px 16px; font-size: 13px;
}
footer a { color: #86efac; text-decoration: underline; }
footer a:hover { color: #4ade80; }

/* ─── Responsive ─── */
@media(max-width: 600px) {
  .board-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .square { min-height: 54px; }
  .square-emoji { font-size: 16px; }
  .dice-section { flex-direction: column; gap: 14px; }
  .scoreboard { gap: 8px; }
  .score-card { min-width: 120px; padding: 10px 12px; }
}
@media(max-width: 420px) {
  .board-grid { grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .popup-box, .result-popup-box { padding: 24px 16px; }
}
</style>
</head>

<script>
(function() {
'use strict';

// ────────────────────────────────────────────
// Square definitions (30 squares: 0=start, 29=goal)
// ────────────────────────────────────────────
const SQUARE_TYPES = [
  // 0

// ────────────────────────────────────────────
// Start game
// ────────────────────────────────────────────
function startGame() {
  players = [];
  for (let i = 0; i < numPlayers; i++) {
    players.push({
      name:     PLAYER_LABELS[i],
      emoji:    PLAYER_EMOJIS[i],
      color:    PLAYER_COLORS[i],
      money:    START_MONEY,
      pos:      0,
      events:   [],
      finished: false,
    });
  }
  currentTurn = 0;
  rolling     = false;
  gameActive  = true;

  setupPanel.style.display    = 'none';
  scoreboard.style.display    = 'flex';
  boardSection.style.display  = 'block';
  diceSection.style.display   = 'flex';
  logSection.style.display    = 'block';
  btnNewGame.style.display     = 'inline-block';

  logList.innerHTML = '';
  renderBoard();
  renderScoreboard();
  updateTurnInfo();
}

// ────────────────────────────────────────────
// Render board (snake layout)
// ────────────────────────────────────────────
function renderBoard() {
  boardGrid.innerHTML = '';
  // Create 30 squares; lay out as 6-per-row zigzag
  // Row 0 (sq 0-5): L→R, Row 1 (sq 6-11): R→L, Row 2 (sq 12-17): L→R,
  // Row 3 (sq 18-23): R→L, Row 4 (sq 24-29): L→R
  const cols   = 6;
  const total  = 30;
  const rows   = Math.ceil(total / cols);
  const layout = [];

  for (let r = 0; r < rows; r++) {
    const start = r * cols;
    const end   = Math.min(start + cols, total);
    const row   = [];
    for (let c = start; c < end; c++) row.push(c);
    if (r % 2 === 1) row.reverse();
    layout.push(row);
  }

  for (const row of layout) {
    for (const idx of row) {
      const sq   = SQUARE_TYPES[idx];
      const div  = document.createElement('div');
      div.className = 'square ' + sq.cls;
      div.id        = 'sq-' + idx;
      div.innerHTML =
        '<span class="square-num">' + idx + '</span>' +
        '<span class="square-emoji">' + sq.emoji + '</span>' +
        '<span class="square-label">' + sq.label + '</span>' +
        '<div class="token-row" id="tokens-' + idx + '"></div>';
      boardGrid.appendChild(div);
    }
  }

  renderTokens();
}

function renderTokens() {
  // Clear all token rows
  document.querySelectorAll('.token-row').forEach(el => el.innerHTML = '');
  document.querySelectorAll('.square').forEach(sq => sq.classList.remove('current-player-here'));

  players.forEach((p, i) => {
    const tr = document.getElementById('tokens-' + p.pos);
    if (!tr) return;
    const tok = document.createElement('div');
    tok.className = 'token';
    tok.style.background = p.color;
    tok.textContent = p.emoji;
    tok.title = p.name;
    tr.appendChild(tok);
    // Highlight current player's square
    if (i === currentTurn && gameActive) {
      const sqEl = document.getElementById('sq-' + p.pos);
      if (sqEl) sqEl.classList.add('current-player-here');
    }
  });
}

// ────────────────────────────────────────────
// Scoreboard
// ────────────────────────────────────────────
function renderScoreboard() {
  scoreboard.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'score-card' + (i === currentTurn && gameActive ? ' active-turn' : '');
    card.id = 'score-' + i;
    const isNeg = p.money < 0;
    card.innerHTML =
      '<div class="score-player-name">' +
        '<span class="score-asset-icon" style="color:' + p.color + '">' + p.emoji + '</span>' +
        '<span style="color:' + p.color + '">' + p.name + '</span>' +
        (p.finished ? ' <span style="font-size:11px;color:#9ca3af">（ゴール）</span>' : '') +
      '</div>' +
      '<div class="score-money ' + (isNeg ? 'negative' : '') + '">' +
        (isNeg ? '▼' : '') + Math.abs(p.money).toLocaleString() + '万円' +
      '</div>' +
      '<div class="score-pos">マス ' + p.pos + ' / 29</div>';
    scoreboard.appendChild(card);
  });
}

// ────────────────────────────────────────────
// Turn info
// ────────────────────────────────────────────
function updateTurnInfo() {
  const p = players[currentTurn];
  turnName.textContent = p.emoji + ' ' + p.name + ' のターン';
  turnName.style.color = p.color;
  turnSub.textContent  = '現在の資産：' + p.money.toLocaleString() + '万円　（マス ' + p.pos + '）';
  btnRoll.disabled     = !gameActive || rolling;
}

// ────────────────────────────────────────────
// Dice roll
// ────────────────────────────────────────────
btnRoll.addEventListener('click', function() {
  if (rolling || !gameActive) return;
  rolling = true;
  btnRoll.disabled = true;

  let ticks = 0;
  const maxTicks = 12;
  const iv = setInterval(function() {
    const r = Math.floor(Math.random() * 6);
    diceDisplay.textContent = DICE_FACES[r];
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(iv);
      const finalRoll = Math.floor(Math.random() * 6) + 1;
      diceDisplay.textContent = DICE_FACES[finalRoll - 1];
      diceDisplay.classList.add('rolling');
      setTimeout(function() {
        diceDisplay.classList.remove('rolling');
        movePlayer(finalRoll);
      }, 500);
    }
  }, 60);
});

// ────────────────────────────────────────────
// Move player
// ────────────────────────────────────────────
function movePlayer(steps) {
  const p     = players[currentTurn];
  const oldPos = p.pos;
  const newPos = Math.min(p.pos + steps, 29);

  // Animate movement step by step
  animateMove(oldPos, newPos, p, function() {
    p.pos = newPos;
    renderTokens();
    renderScoreboard();

    if (newPos === 29) {
      p.finished = true;
      addLog(p, '🏆', p.name + ' がゴールに到達しました！');
      setTimeout(function() {
        showGoalEvent(p, function() {
          checkAllFinished();
        });
      }, 200);
    } else {
      setTimeout(function() {
        triggerSquareEvent(newPos, p, function() {
          rolling = false;
          advanceTurn();
        });
      }, 200);
    }
  });
}

function animateMove(from, to, p, cb) {
  if (from === to) { cb(); return; }
  let cur = from;
  function step() {
    cur = Math.min(cur + 1, to);
    p.pos = cur;
    renderTokens();
    if (cur < to) {
      setTimeout(step, 120);
    } else {
      setTimeout(cb, 100);
    }
  }
  setTimeout(step, 80);
}

          '💡 さらに一定額以上は <strong>高額療養費制度</strong>で戻ってきます。\n' +
          '医療保険に入っておくと、入院時の出費を減らせます。\n' +
          '今回は保険がなかったため <strong>-' + sickAmt + '万円</strong> の出費に。',
      });
      break;
    }

    case 'skill': {
      const skillGain = 20;
      p.money += skillGain;
      p._skillBonus = (p._skillBonus || 0) + skillGain;
      p.events.push({ emoji:'🎓', text:'スキルアップ！年収+' + skillGain + '万円UP' });
      addLog(p, '🎓', p.name + ' がスキルアップ！ 年収 +' + skillGain + '万円');
      showPopup({
        emoji:'🎓', title:'スキルアップ！',
        resultText:'年収 +' + skillGain + '万円 UP',
        resultClass:'plus',
        explain: '<strong>スキルアップ</strong>とは、資格の取得や学習で自分の能力を高めること。\n' +
          '能力が上がると <strong>昇給</strong>や<strong>転職</strong>で年収を増やせます。\n\n' +
          '例：ITパスポート・FP・簿記・英語力など\n\n' +
          '💡 若いうちに学ぶ習慣をつけると、将来の選択肢がぐっと広がります！\n' +
          '年収が <strong>+' + skillGain + '万円</strong> 増えました。',
        cb: function() {
          rolling = false;
          renderScoreboard(); updateTurnInfo(); advanceTurn();
        }
      });
      return;
    }

    case 'lucky': {
      const luckyAmt = 10 + Math.floor(Math.random() * 5) * 10; // 10,20,30,40,50
      applyMoney(p, +luckyAmt, cb, {
        emoji:'⭐', title:'ラッキー！',
        resultText:'+' + luckyAmt + '万円',
        resultClass:'plus',
        explain: '思わぬ <strong>臨時収入</strong> が入りました！\n\n' +
          '（遺産相続・副業収入・投資配当・宝くじ…など様々なラッキーがあります）\n\n' +
          '💡 突然のお金は「あぶく銭」とも言います。\n' +
          '使い方次第で資産になるかどうかが決まります。\n' +
          'まずは生活防衛資金（生活費3〜6か月分）を確保しましょう！',
      });
      break;
    }

    case 'rest':
    default:
      showPopup({
        emoji:'💤', title:'休憩マス',
        resultText:'変化なし',
        resultClass:'neutral',
        explain: 'このマスは <strong>休憩マス</strong>。今回は何も起こりません。\n\n' +
          '人生にも「何もない日」があります。それが実は一番大切かも？\n\n' +
          '💡 毎日節約・投資を意識するより、たまにリセットして家計を見直すことも大切です。',
        cb: function() {
          rolling = false;
          advanceTurn();
        }
      });
      return;
  }
}

// ────────────────────────────────────────────
// Helper: apply money change and show popup
// ────────────────────────────────────────────
function applyMoney(p, delta, cb, opts) {
  p.money += delta;
  const sign = delta >= 0 ? '+' : '';
  p.events.push({ emoji: opts.emoji, text: opts.title + '（' + sign + delta + '万円）' });
  addLog(p, opts.emoji, p.name + ' — ' + opts.title + '（' + sign + delta + '万円）');
  showPopup({
    emoji: opts.emoji,
    title: opts.title,
    resultText: opts.resultText,
    resultClass: opts.resultClass,
    explain: opts.explain,
    cb: function() {
      rolling = false;
      renderScoreboard();
      updateTurnInfo();
      cb();
    }
  });
}

// ────────────────────────────────────────────
// Show popup
// ────────────────────────────────────────────
let pendingPopupCb = null;

function showPopup(opts) {
  popupEmoji.textContent    = opts.emoji;
  popupTitle.textContent    = opts.title;
  popupResult.textContent   = opts.resultText;
  popupResult.className     = 'popup-result ' + (opts.resultClass || 'neutral');
  // Convert \n to <br>
  popupExplain.innerHTML    = opts.explain.replace(/\n/g, '<br>');
  pendingPopupCb            = opts.cb || null;
  popupOverlay.classList.add('open');
  renderScoreboard();
  updateTurnInfo();
}

function closePopup() {
  popupOverlay.classList.remove('open');
  const cb = pendingPopupCb;
  pendingPopupCb = null;
  if (cb) cb();
}

// ────────────────────────────────────────────
// Goal event
// ────────────────────────────────────────────
function showGoalEvent(p, cb) {
  showPopup({
    emoji: '🏆',
    title: p.name + ' ゴール！',
    resultText: '最終資産：' + p.money.toLocaleString() + '万円',
    resultClass: p.money >= 100 ? 'plus' : 'minus',
    explain: 'おめでとう！ゴールに到達しました！\n' +
      '最終的な資産は <strong>' + p.money.toLocaleString() + '万円</strong> です。\n\n' +
      '💡 人生ゲームのゴールは「お金持ちになること」だけではありません。\n' +
      '大切なのはお金の <strong>使い方・増やし方・守り方</strong> を知ること。\n' +
      'これが本物の <strong>ライフアセット（人生の資産）</strong> です！',
    cb: cb
  });
}

// ────────────────────────────────────────────
// Advance turn
// ────────────────────────────────────────────
function advanceTurn() {
  // Check if all finished
  if (players.every(p => p.finished)) {
    showFinalResult();
    return;
  }
  // Find next unfinished player
  let next = (currentTurn + 1) % numPlayers;
  let attempts = 0;
  while (players[next].finished && attempts < numPlayers) {
    next = (next + 1) % numPlayers;
    attempts++;
  }
  currentTurn = next;
  rolling     = false;
  btnRoll.disabled = false;
  renderTokens();
  renderScoreboard();
  updateTurnInfo();
}

// ────────────────────────────────────────────
// Check all finished
// ────────────────────────────────────────────
function checkAllFinished() {
  if (players.every(p => p.finished)) {
    setTimeout(showFinalResult, 400);
  } else {
    rolling = false;
    advanceTurn();
  }
}

// ────────────────────────────────────────────
// Final result
// ────────────────────────────────────────────
function getGrade(money) {
  if (money >= 400) return 'S';
  if (money >= 250) return 'A';
  if (money >= 100) return 'B';
  return 'C';
}
function gradeMsg(g) {
  if (g === 'S') return '素晴らしい！資産形成の天才！将来はきっと安心できます🌟';
  if (g === 'A') return 'とても優秀！お金の使い方がうまいです！';
  if (g === 'B') return 'まずまず。もう少し投資や節約を意識してみよう！';
  return '資産がマイナスに…。でも大丈夫！今から学べばまだ間に合います💪';
}

function showFinalResult() {
  gameActive = false;
  btnRoll.disabled = true;

  let html = '';

  if (numPlayers === 1) {
    const p     = players[0];
    const grade = getGrade(p.money);
    html += '<div class="result-grade grade-' + grade + '">' + grade + '</div>';
    html += '<div class="result-money">' + p.money.toLocaleString() + '万円</div>';
    html += '<div class="result-grade-msg">' + gradeMsg(grade) + '</div>';
    html += '<div class="result-events"><h4>あなたの人生イベント</h4>';
    p.events.forEach(function(ev) {
      html += ev.emoji + ' ' + ev.text + '<br>';
    });
    html += '</div>';
  } else {
    // Multi-player ranking
    const sorted = [...players].sort((a, b) => b.money - a.money);
    html += '<div style="font-size:1.1rem;font-weight:800;color:#86efac;margin-bottom:14px;">最終ランキング</div>';
    html += '<div class="result-players">';
    sorted.forEach(function(p, rank) {
      const grade = getGrade(p.money);
      const isPos = p.money >= START_MONEY;
      html +=
        '<div class="result-player-row">' +
          '<div class="result-player-name" style="color:' + p.color + '">' +
            (rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : '🏅') +
            ' ' + p.emoji + ' ' + p.name +
          '</div>' +
          '<div class="result-player-money ' + (isPos ? 'pos' : 'neg') + '">' +
            p.money.toLocaleString() + '万円' +
          '</div>' +
          '<div class="result-player-grade">評価：' + grade + '</div>' +
        '</div>';
    });
    html += '</div>';
    // Winner events
    html += '<div class="result-events"><h4>' + sorted[0].emoji + ' ' + sorted[0].name + ' のイベント</h4>';
    sorted[0].events.forEach(function(ev) { html += ev.emoji + ' ' + ev.text + '<br>'; });
    html += '</div>';
  }

  resultContent.innerHTML = html;
  resultOverlay.classList.add('open');
}

// ────────────────────────────────────────────
// Log
// ────────────────────────────────────────────
function addLog(p, emoji, text) {
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML =
    '<span class="log-emoji">' + emoji + '</span>' +
    '<span style="color:' + p.color + ';font-weight:700;">' + p.name + '</span> ' +
    '<span>' + text.replace(p.name + ' — ', '').replace(p.name + ' ', '') + '</span>';
  logList.prepend(entry);
}

// ────────────────────────────────────────────
// Reset
// ────────────────────────────────────────────
function resetGame() {
  resultOverlay.classList.remove('open');
  popupOverlay.classList.remove('open');

  scoreboard.style.display    = 'none';
  boardSection.style.display  = 'none';
  diceSection.style.display   = 'none';
  logSection.style.display    = 'none';
  setupPanel.style.display    = 'block';
  btnNewGame.style.display    = 'none';

  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'));
  btnStart.disabled = true;
  numPlayers = 0;
  players    = [];
  gameActive = false;
  rolling    = false;
  diceDisplay.textContent = '🎲';
  boardGrid.innerHTML     = '';
  scoreboard.innerHTML    = '';
  logList.innerHTML       = '';
  turnName.textContent    = '— のターン';
  turnSub.textContent     = '';
}

})();
</script>
