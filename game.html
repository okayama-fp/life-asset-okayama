<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>ツムツム風ゲーム</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Hiragino Kaku Gothic ProN',sans-serif;user-select:none;}
  h1{color:#fff;font-size:20px;margin-bottom:8px;letter-spacing:2px;}
  #ui{display:flex;gap:24px;align-items:center;margin-bottom:10px;}
  .ui-box{background:rgba(255,255,255,0.12);border-radius:12px;padding:8px 20px;text-align:center;}
  .ui-label{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:1px;}
  .ui-val{font-size:24px;font-weight:900;color:#fff;}
  #timer-bar-wrap{width:320px;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;margin-bottom:8px;}
  #timer-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#4ab8b8,#7ad4d4);transition:width .1s linear;}
  #canvas{border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.5);touch-action:none;cursor:pointer;}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;font-size:28px;font-weight:900;padding:24px 48px;border-radius:20px;display:none;text-align:center;z-index:10;}
  #start-btn{margin-top:14px;background:linear-gradient(135deg,#4ab8b8,#2e9090);color:#fff;border:none;padding:14px 48px;border-radius:32px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:2px;}
  #start-btn:hover{opacity:0.9;}
  #combo{position:absolute;font-size:32px;font-weight:900;color:#ffe066;text-shadow:0 2px 8px rgba(0,0,0,0.5);pointer-events:none;opacity:0;transition:opacity .3s;}
</style>
</head>
<body>
<h1>🐧 TSUM TSUM</h1>
<div id="ui">
  <div class="ui-box"><div class="ui-label">SCORE</div><div class="ui-val" id="score">0</div></div>
  <div class="ui-box"><div class="ui-label">BEST</div><div class="ui-val" id="best">0</div></div>
</div>
<div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>
<div style="position:relative">
  <canvas id="canvas" width="320" height="460"></canvas>
  <div id="combo"></div>
</div>
<div id="msg">
  <div id="msg-text"></div>
  <br>
  <button id="start-btn" onclick="startGame()">▶ スタート</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const COLS = 7, ROWS = 8;
const R = 22;
const PAD_X = (W - COLS * R * 2) / 2 + R;

// キャラクター定義
const CHARS = [
  {face:'🐧', bg:'#4ab8b8', shadow:'#2e9090'},
  {face:'🐻', bg:'#f5a623', shadow:'#d4851a'},
  {face:'🐱', bg:'#e67fbb', shadow:'#c45a98'},
  {face:'🐸', bg:'#6bcb6b', shadow:'#4aa84a'},
  {face:'🐹', bg:'#a07fe6', shadow:'#7e5ec4'},
];

let tsums = [], dragging = false, chain = [], score = 0, best = 0, timeLeft = 60, timer = null, gameActive = false;

function getPos(col, row, offset=0) {
  const x = PAD_X + col * R * 2 + (row % 2 === 1 ? R : 0);
  const y = H - R - row * (R * 1.72) + offset;
  return {x, y};
}

function createTsum(col, row) {
  const t = Math.floor(Math.random() * CHARS.length);
  const pos = getPos(col, row, -H);
  return {col, row, type:t, x:pos.x, y:pos.y, vy:0, targetY:getPos(col,row).y, alpha:1, scale:1};
}

function initBoard() {
  tsums = [];
  for(let r = 0; r < ROWS; r++)
    for(let c = 0; c < COLS; c++)
      if(r % 2 === 0 || c < COLS - 1)
        tsums.push(createTsum(c, r));
}

function getTsumAt(x, y) {
  let best = null, bd = Infinity;
  for(const t of tsums) {
    const d = Math.hypot(t.x - x, t.y - y);
    if(d < R * 1.1 && d < bd) { bd = d; best = t; }
  }
  return best;
}

function isAdjacent(a, b) {
  const dx = Math.abs(a.col - b.col), dy = Math.abs(a.row - b.row);
  if(dy === 0) return dx === 1;
  if(dy === 1) {
    const offset = a.row % 2 === 1 ? 0 : 1;
    return dx === 0 || dx === offset;
  }
  return false;
}

function drawTsum(t, highlight) {
  ctx.save();
  ctx.globalAlpha = t.alpha;
  ctx.translate(t.x, t.y);
  ctx.scale(t.scale, t.scale);
  const ch = CHARS[t.type];

  // shadow
  ctx.beginPath();
  ctx.ellipse(2, 4, R-2, R-4, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fill();

  // body
  const grad = ctx.createRadialGradient(-R*0.3,-R*0.3,2, 0,0,R);
  grad.addColorStop(0, lighten(ch.bg, 40));
  grad.addColorStop(1, ch.shadow);
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // highlight ring
  if(highlight) {
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI*2);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // shine
  ctx.beginPath();
  ctx.ellipse(-R*0.3, -R*0.35, R*0.28, R*0.18, -0.5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();

  // face emoji
  ctx.font = `${R}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ch.face, 0, 2);

  ctx.restore();
}

function lighten(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16)+amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16)+amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16)+amt);
  return `rgb(${r},${g},${b})`;
}

function drawLine() {
  if(chain.length < 2) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(chain[0].x, chain[0].y);
  for(let i = 1; i < chain.length; i++) ctx.lineTo(chain[i].x, chain[i].y);
  ctx.stroke();
  ctx.restore();
}

let particles = [];
function addParticles(x, y, color) {
  for(let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 / 8) * i;
    particles.push({x, y, vx: Math.cos(angle)*3, vy: Math.sin(angle)*3 - 2, alpha:1, color, r:4});
  }
}

function updateParticles() {
  particles = particles.filter(p => p.alpha > 0.05);
  for(const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha -= 0.04;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a2a4a');
  bg.addColorStop(1,'#0a1828');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(0,0,W,H,20);
  ctx.fill();

  drawLine();
  for(const t of tsums) drawTsum(t, chain.includes(t));
  updateParticles();

  // chain count badge
  if(chain.length >= 3) {
    ctx.save();
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${chain.length}チェーン！`, W/2, 30);
    ctx.restore();
  }
}

let lastTime = 0;
function animate(ts) {
  const dt = Math.min((ts - lastTime) / 16, 3);
  lastTime = ts;

  for(const t of tsums) {
    if(t.y < t.targetY) {
      t.vy += 0.8 * dt;
      t.y += t.vy * dt;
      if(t.y >= t.targetY) { t.y = t.targetY; t.vy = 0; }
    }
  }

  draw();
  requestAnimationFrame(animate);
}

function clearChain() {
  if(chain.length < 3) { chain = []; return; }
  const pts = chain.length * chain.length * 10;
  score += pts;
  document.getElementById('score').textContent = score;

  // particles
  for(const t of chain) addParticles(t.x, t.y, CHARS[t.type].bg);

  // show combo
  if(chain.length >= 5) showCombo(chain.length);

  // remove & refill
  for(const t of chain) {
    const idx = tsums.indexOf(t);
    if(idx >= 0) tsums.splice(idx, 1);
  }
  chain = [];
  refill();
}

function refill() {
  setTimeout(() => {
    const existing = new Set(tsums.map(t => `${t.col},${t.row}`));
    for(let r = 0; r < ROWS; r++)
      for(let c = 0; c < COLS; c++) {
        if(r % 2 !== 0 && c >= COLS-1) continue;
        if(!existing.has(`${c},${r}`)) {
          const nt = createTsum(c, r);
          nt.y = -R * 2;
          nt.vy = 0;
          tsums.push(nt);
        }
      }
  }, 150);
}

function showCombo(n) {
  const el = document.getElementById('combo');
  el.textContent = `${n}チェーン！🎉`;
  el.style.opacity = 1;
  el.style.top = '40%';
  el.style.left = '50%';
  el.style.transform = 'translate(-50%,-50%)';
  setTimeout(() => el.style.opacity = 0, 800);
}

// input
function getCanvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {x:(src.clientX - rect.left)*scaleX, y:(src.clientY - rect.top)*scaleY};
}

canvas.addEventListener('mousedown', e => { if(!gameActive) return; dragging=true; chain=[]; const {x,y}=getCanvasXY(e); const t=getTsumAt(x,y); if(t) chain.push(t); });
canvas.addEventListener('mousemove', e => {
  if(!dragging||!gameActive) return;
  const {x,y}=getCanvasXY(e);
  const t=getTsumAt(x,y);
  if(t && !chain.includes(t) && chain.length>0 && t.type===chain[0].type && isAdjacent(chain[chain.length-1],t)) chain.push(t);
  else if(chain.length>=2 && t===chain[chain.length-2]) chain.pop();
});
canvas.addEventListener('mouseup', () => { if(!gameActive) return; dragging=false; clearChain(); });

canvas.addEventListener('touchstart', e=>{e.preventDefault(); if(!gameActive) return; dragging=true; chain=[]; const {x,y}=getCanvasXY(e); const t=getTsumAt(x,y); if(t) chain.push(t);},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!dragging||!gameActive) return;
  const {x,y}=getCanvasXY(e);
  const t=getTsumAt(x,y);
  if(t && !chain.includes(t) && chain.length>0 && t.type===chain[0].type && isAdjacent(chain[chain.length-1],t)) chain.push(t);
  else if(chain.length>=2 && t===chain[chain.length-2]) chain.pop();
},{passive:false});
canvas.addEventListener('touchend', e=>{e.preventDefault(); if(!gameActive) return; dragging=false; clearChain();},{passive:false});

function startGame() {
  document.getElementById('msg').style.display = 'none';
  score = 0;
  timeLeft = 60;
  document.getElementById('score').textContent = 0;
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('timer-bar').style.background = 'linear-gradient(90deg,#4ab8b8,#7ad4d4)';
  initBoard();
  chain = [];
  gameActive = true;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft -= 0.1;
    const pct = (timeLeft / 60) * 100;
    document.getElementById('timer-bar').style.width = pct + '%';
    if(timeLeft < 10) document.getElementById('timer-bar').style.background = 'linear-gradient(90deg,#e05050,#f07070)';
    if(timeLeft <= 0) endGame();
  }, 100);
}

function endGame() {
  clearInterval(timer);
  gameActive = false;
  if(score > best) {
    best = score;
    document.getElementById('best').textContent = best;
  }
  const msg = document.getElementById('msg');
  document.getElementById('msg-text').innerHTML = `ゲームオーバー！<br><span style="font-size:42px;color:#ffe066">${score}</span><br><span style="font-size:14px;color:rgba(255,255,255,0.7)">ベスト: ${best}</span>`;
  msg.style.display = 'block';
}

// init
const msg = document.getElementById('msg');
document.getElementById('msg-text').innerHTML = '🐧 ツムツム<br><span style="font-size:14px;color:rgba(255,255,255,0.7)">同じキャラを3つ以上つなげよう！</span>';
msg.style.display = 'block';
initBoard();
requestAnimationFrame(animate);
</script>
</body>
</html>
