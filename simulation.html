<title>資産シミュレーター｜ライフアセットオフィス</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0fdf4;
    padding: 20px;
    min-height: 100vh;
  }
  .page-wrapper {
    display: flex;
    gap: 28px;
    max-width: 760px;
    margin: auto;
    align-items: flex-start;
  }
  .box {
    flex: 1;
    background: white;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(26,122,74,0.10);
    border-top: 4px solid #1a7a4a;
  }
  h2 {
    text-align: center;
    color: #1a3d2b;
    font-size: 18px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #444;
    margin-top: 10px;
    margin-bottom: 2px;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 0;
    border-radius: 6px;
    border: 1px solid #86efac;
    box-sizing: border-box;
    font-size: 14px;
    background: #f0fdf4;
  }
  input:focus { outline: none; border-color: #1a7a4a; background: #fff; }
  button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #1a7a4a, #22c55e);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 16px;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: opacity .2s;
  }
  button:hover { opacity: 0.88; }
  .result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    color: #1a3d2b;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #1a7a4a;
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { text-decoration: underline; }

  /* キャラクター */
  .character-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 48px;
    min-width: 130px;
  }
  .speech-bubble {
    background: #fff;
    border: 2px solid #86efac;
    border-radius: 14px;
    padding: 10px 13px;
    font-size: 12px;
    color: #1a3d2b;
    font-weight: 700;
    line-height: 1.6;
    text-align: center;
    position: relative;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(26,122,74,0.10);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #86efac;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #fff;
    z-index: 1;
  }
  .character {
    text-align: center;
    font-size: 13px;
    color: #1a7a4a;
    font-weight: 700;
  }
  .character p { margin: 6px 0 0; }

  @media (max-width: 580px) {
    .page-wrapper { flex-direction: column; align-items: center; }
    .character-col { flex-direction: row; gap: 12px; align-items: center; padding-top: 0; order: -1; }
    .speech-bubble::after, .speech-bubble::before { display: none; }
    .speech-bubble { margin-bottom: 0; }
  }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1266918303152498"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="page-wrapper">
  <!-- シミュレーター -->
  <div class="box">
    <h2>資産シミュレーション</h2>

    <label>現在の資産（万円）</label>
    <input type="number" id="initial" value="3700" min="0" max="999999" step="1" required>

    <label>毎月の積立（万円）</label>
    <input type="number" id="monthly" value="10" min="0" max="10000" step="1" required>

    <label>想定利回り（%）</label>
    <input type="number" id="rate" value="5" min="0" max="50" step="0.01" required>

    <label>運用年数（年）</label>
    <input type="number" id="years" value="20" min="1" max="50" step="1" required>

    <button onclick="calculate()">計算する</button>

    <div class="result" id="result"></div>

    <a href="index.html" class="back-link">← トップページに戻る</a>
  </div>

</div>

<script>
function calculate() {
  const initialMan = parseFloat(document.getElementById("initial").value);
  const monthlyMan = parseFloat(document.getElementById("monthly").value);
  const rateVal    = parseFloat(document.getElementById("rate").value);
  const years      = parseFloat(document.getElementById("years").value);
  const resultEl   = document.getElementById("result");

  if ([initialMan, monthlyMan, rateVal, years].some(isNaN)) {
    resultEl.textContent = "入力値に誤りがあります。"; return;
  }
  if (initialMan < 0 || initialMan > 999999) {
    resultEl.textContent = "現在の資産は0〜999999万円で入力してください。"; return;
  }
  if (monthlyMan < 0 || monthlyMan > 10000) {
    resultEl.textContent = "毎月の積立は0〜10000万円で入力してください。"; return;
  }
  if (rateVal < 0 || rateVal > 50) {
    resultEl.textContent = "利回りは0〜50%で入力してください。"; return;
  }
  if (years < 1 || years > 50) {
    resultEl.textContent = "運用年数は1〜50年で入力してください。"; return;
  }

  const monthly = monthlyMan * 10000;
  const rate    = rateVal / 100;
  let   total   = initialMan * 10000;

  for (let i = 0; i < years * 12; i++) {
    total = total * (1 + rate / 12) + monthly;
  }

  resultEl.textContent = "将来資産：約 " + Math.round(total / 10000).toLocaleString() + " 万円";
}
</script>

</body>
</html>
