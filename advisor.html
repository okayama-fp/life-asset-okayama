<h1>アドバイザー業務</h1>
<p class="subtitle">専門知識を活かした各種シミュレーション</p>

<!-- ライフプラン -->
<div class="box">
  <h3>ライフプラン（老後資金）</h3>

  <label>現在の年齢</label>
  <input id="age" type="number" placeholder="例：45">

  <label>引退年齢</label>
  <input id="retire" type="number" placeholder="例：60">

  <label>寿命（想定）</label>
  <input id="life" type="number" placeholder="例：90">

  <label>月の生活費（万円）</label>
  <input id="monthlyCost" type="number" placeholder="例：25">

  <label>年金（万円/年）</label>
  <input id="pension" type="number" placeholder="例：150">

  <button onclick="lifePlan()">計算する</button>
  <div class="result" id="lifeResult"></div>
</div>

<!-- 相続シミュレーション -->
<div class="box">
  <h3>相続シミュレーション</h3>

  <label>総資産（万円）</label>
  <input id="asset" type="number" placeholder="例：8000">

  <label>相続人数</label>
  <input id="heirs" type="number" placeholder="例：3">

  <button onclick="inheritCalc()">計算する</button>
  <div class="result" id="inheritResult"></div>
</div>

<!-- 保険見直し -->
<div class="box">
  <h3>保険見直し診断</h3>

  <label>年収（万円）</label>
  <input id="income" type="number" placeholder="例：600">

  <label>現在の保険料（万円/年）</label>
  <input id="insurance" type="number" placeholder="例：40">

  <button onclick="insuranceCheck()">診断する</button>
  <div class="result" id="insuranceResult"></div>
</div>

<a href="index.html" class="back-link">← トップページに戻る</a>

<script>
function lifePlan() {
  let age      = +document.getElementById("age").value;
  let retire   = +document.getElementById("retire").value;
  let life     = +document.getElementById("life").value;
  let monthly  = +document.getElementById("monthlyCost").value * 10000;
  let pension  = +document.getElementById("pension").value * 10000;

  let years        = life - retire;
  let totalCost    = monthly * 12 * years;
  let totalPension = pension * years;
  let shortage     = totalCost - totalPension;

  document.getElementById("lifeResult").innerHTML =
    "老後必要資金：約 " + Math.round(totalCost / 10000).toLocaleString() + " 万円<br>" +
    "年金総額：約 " + Math.round(totalPension / 10000).toLocaleString() + " 万円<br>" +
    "不足額：約 " + Math.round(shortage / 10000).toLocaleString() + " 万円";
}

function inheritCalc() {
  let asset  = +document.getElementById("asset").value * 10000;
  let heirs  = +document.getElementById("heirs").value;

  let base    = (3000 + 600 * heirs) * 10000;
  let taxable = Math.max(asset - base, 0);
  let tax     = taxable * 0.1;

  document.getElementById("inheritResult").innerHTML =
    "基礎控除額：約 " + Math.round(base / 10000).toLocaleString() + " 万円<br>" +
    "課税対象額：約 " + Math.round(taxable / 10000).toLocaleString() + " 万円<br>" +
    "相続税（目安）：約 " + Math.round(tax / 10000).toLocaleString() + " 万円";
}

function insuranceCheck() {
  let income    = +document.getElementById("income").value;
  let insurance = +document.getElementById("insurance").value;

  let ideal = income * 0.05;
  let diff  = insurance - ideal;

  let msg = diff > 0
    ? "払いすぎの可能性があります（約 " + Math.round(diff) + " 万円/年）"
    : diff < 0
    ? "保障が不足している可能性があります（約 " + Math.round(Math.abs(diff)) + " 万円/年）"
    : "適正な保険料です";

  document.getElementById("insuranceResult").innerHTML =
    "適正保険料：約 " + Math.round(ideal).toLocaleString() + " 万円/年<br>" +
    msg;
}
</script>
