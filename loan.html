<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>融資シミュレーター｜ライフアセットパートナーズ</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f9ff;
  padding: 20px;
  min-height: 100vh;
}
.page-wrapper {
  display: flex;
  gap: 28px;
  max-width: 760px;
  margin: auto;
  align-items: flex-start;
}
.box {
  flex: 1;
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(14,165,233,0.10);
  border-top: 4px solid #0ea5e9;
}
h2 { text-align: center; color: #0f3460; margin-bottom: 16px; font-size: 18px; }
label { display: block; font-size: 13px; color: #444; margin-top: 10px; margin-bottom: 2px; }
input {
  width: 100%;
  padding: 10px;
  margin: 0;
  border: 1px solid #bae6fd;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 14px;
  background: #f0f9ff;
}
input:focus { outline: none; border-color: #0ea5e9; background: #fff; }
button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(90deg, #0ea5e9, #38bdf8);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
  transition: opacity .2s;
}
button:hover { opacity: 0.88; }
.result {
  margin-top: 20px;
  font-weight: bold;
  font-size: 15px;
  line-height: 2;
  text-align: center;
  color: #0f3460;
}
.safe   { color: #16a34a; }
.warn   { color: #d97706; }
.danger { color: #dc2626; }
table {
  width: 100%;
  margin-top: 16px;
  border-collapse: collapse;
}
td, th {
  border: 1px solid #bae6fd;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}
th { background: #0ea5e9; color: white; }
h3 { color: #0f3460; margin-top: 20px; margin-bottom: 8px; font-size: 15px; }
.back-link {
  display: block;
  text-align: center;
  margin-top: 24px;
  color: #0ea5e9;
  text-decoration: none;
  font-size: 13px;
}
.back-link:hover { text-decoration: underline; }

/* キャラクター */
.character-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 48px;
  min-width: 130px;
}
.speech-bubble {
  background: #fff;
  border: 2px solid #bae6fd;
  border-radius: 14px;
  padding: 10px 13px;
  font-size: 12px;
  color: #0f3460;
  font-weight: 700;
  line-height: 1.6;
  text-align: center;
  position: relative;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(14,165,233,0.10);
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #bae6fd;
}
.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #fff;
  z-index: 1;
}
.character {
  text-align: center;
  font-size: 13px;
  color: #2c6fb7;
  font-weight: 700;
}
.character p { margin: 6px 0 0; }

@media (max-width: 580px) {
  .page-wrapper { flex-direction: column; align-items: center; }
  .character-col { flex-direction: row; gap: 12px; align-items: center; padding-top: 0; order: -1; }
  .speech-bubble::after, .speech-bubble::before { display: none; }
  .speech-bubble { margin-bottom: 0; }
}
</style>
</head>

<body>

<div class="page-wrapper">
  <!-- シミュレーター -->
  <div class="box">
    <h2>融資シミュレーション</h2>

    <label>借入額（万円）</label>
    <input id="loan" type="number" value="300">

    <label>金利（%）</label>
    <input id="rate" type="number" value="3">

    <label>返済年数</label>
    <input id="years" type="number" value="5">

    <label>月収（万円）</label>
    <input id="income" type="number" value="30">

    <label>生活費（万円）</label>
    <input id="expense" type="number" value="20">

    <label>既存ローン返済（万円）</label>
    <input id="other" type="number" value="0">

    <button onclick="calc()">計算する</button>

    <div class="result" id="result"></div>
    <div id="tableArea"></div>

    <a href="index.html" class="back-link">← トップページに戻る</a>
  </div>

  <!-- キャラクター -->
  <div class="character-col">
    <div class="speech-bubble">最適な返済プランを<br>一緒に探しましょう！</div>
    <div class="character">
      <svg width="110" height="110" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="40" fill="#eaf4ff"/>
        <circle cx="45" cy="55" r="5" fill="#2c6fb7"/>
        <circle cx="75" cy="55" r="5" fill="#2c6fb7"/>
        <path d="M45 75 Q60 85 75 75" stroke="#2c6fb7" stroke-width="3" fill="none"/>
      </svg>
      <p>ライフアセットくん</p>
    </div>
  </div>
</div>

<script>
function payment(P, r, n) {
  if (r === 0) return P / n;
  return P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
}

function calc() {
  let loan    = +document.getElementById("loan").value * 10000;
  let rate    = +document.getElementById("rate").value / 100 / 12;
  let years   = +document.getElementById("years").value;
  let n       = years * 12;
  let monthly = payment(loan, rate, n);

  let income  = +document.getElementById("income").value * 10000;
  let expense = +document.getElementById("expense").value * 10000;
  let other   = +document.getElementById("other").value * 10000;
  let remain  = income - expense - other - monthly;

  let status, cls;
  if (remain > 30000)      { status = "安全"; cls = "safe"; }
  else if (remain > 0)     { status = "注意"; cls = "warn"; }
  else                     { status = "危険"; cls = "danger"; }

  document.getElementById("result").innerHTML =
    "毎月返済：約 " + Math.round(monthly / 10000).toLocaleString() + " 万円<br>" +
    "残り余力：" + Math.round(remain / 10000).toLocaleString() + " 万円<br>" +
    "判定：<span class='" + cls + "'>" + status + "</span>";

  let plans = [3, 5, 7];
  let html = "<h3>返済プラン比較</h3><table><tr><th>年数</th><th>月額</th><th>総支払</th></tr>";
  plans.forEach(y => {
    let m     = payment(loan, rate, y * 12);
    let total = m * y * 12;
    html += "<tr><td>" + y + "年</td><td>" + Math.round(m / 10000).toLocaleString() + "万</td><td>" + Math.round(total / 10000).toLocaleString() + "万</td></tr>";
  });
  html += "</table>";
  document.getElementById("tableArea").innerHTML = html;
}
</script>

</body>
</html>
