<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファミリーアセットデザイン｜（削除済み）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#0b1c2c;color:#fff;}
.container{max-width:900px;margin:auto;padding:20px 20px 80px;}
h1,h2{color:gold;}
h1{font-size:clamp(22px,4vw,36px);line-height:1.4;margin-bottom:12px;}
h2{font-size:20px;margin-bottom:12px;}
.card{background:#122c44;padding:20px;border-radius:10px;margin-bottom:20px;}
label{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-top:10px;}
input[type=number],input[type=text],input[type=email],select,textarea{
  width:100%;padding:10px;margin-top:4px;
  background:#0b1c2c;border:1px solid rgba(255,255,255,.2);
  border-radius:6px;color:#fff;font-size:14px;
}
input[type=checkbox]{width:auto;margin-right:6px;}
.chk-label{display:flex;align-items:center;margin-top:10px;cursor:pointer;}
button{
  width:100%;padding:13px;margin-top:14px;
  background:gold;border:none;border-radius:6px;
  font-weight:bold;font-size:15px;cursor:pointer;
}
button:hover{background:#e6b800;}
.btn-line{background:#06C755;color:#fff;}
.btn-line:hover{background:#05a845;}
.result-big{font-size:32px;font-weight:bold;color:gold;margin:8px 0;}
.result-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px;}
.result-item p{font-size:12px;color:rgba(255,255,255,.6);}
.result-item span{font-size:18px;font-weight:bold;color:#fff;}
.msg{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:4px;background:rgba(255,255,255,.08);}
.score-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.score-item{background:rgba(0,0,0,.3);border-radius:8px;padding:12px;text-align:center;}
.score-item p{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:4px;}
.score-item span{font-size:24px;font-weight:bold;color:gold;}
.total-score{font-size:28px;font-weight:bold;color:gold;}
.comment{margin-top:12px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.85);}
.hero{display:flex;justify-content:space-between;align-items:center;
  padding:40px 20px;gap:20px;flex-wrap:wrap;}
.hero-text{flex:1;min-width:200px;}
.hero-text p{margin-top:10px;font-size:15px;color:rgba(255,255,255,.8);}
.hero img{width:180px;border-radius:10px;object-fit:cover;}
.ratio-row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;}
.ratio-item{flex:1;background:rgba(0,0,0,.3);border-radius:6px;padding:10px;text-align:center;}
.ratio-item p{font-size:11px;color:rgba(255,255,255,.6);}
.ratio-item span{font-size:16px;font-weight:bold;color:#fff;}
canvas{margin:0 0 20px;max-height:280px;}
hr{border:none;border-top:1px solid rgba(255,255,255,.15);margin:16px 0;}
.fixed-line{
  position:fixed;bottom:0;left:0;right:0;
  background:#06C755;text-align:center;padding:14px;z-index:100;
}
.fixed-line a{color:#fff;text-decoration:none;font-weight:bold;font-size:15px;}
@media(max-width:600px){
  .hero{flex-direction:column;text-align:center;}
  .hero img{width:150px;}
  .score-box{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">

<!-- ヒーロー -->
<div class="hero">
  <div class="hero-text">
    <h1>あなたの資産を<br>共に育てるパートナー</h1>
    <p>個人資産管理から資金調達まで、<br>最適なプランをご提案します。</p>
  </div>
  <img src="images/fp-removed.jpg"
       onerror="this.src='https://images.unsplash.com/photo-1560250097-0b93528c311a?w=300&h=360&fit=crop&crop=faces&q=80'"
       alt="（削除済み） （削除済み）">
</div>

<!-- NISAシミュレーター -->
<div class="card">
  <h2>📊 NISA資産シミュレーター</h2>

  <label>毎月積立額（円）</label>
  <input type="number" id="monthly" value="30000">

  <label>初期投資額（円）</label>
  <input type="number" id="initial" value="0">

  <label>年利（%）</label>
  <input type="number" id="rate" value="5">

  <label>運用年数（年）</label>
  <input type="number" id="years" value="20">

  <label class="chk-label">
    <input type="checkbox" id="inflation"> インフレ考慮（実質 −2%）
  </label>

  <button onclick="calc()">計算する</button>
</div>

<div class="card">
  <p style="color:rgba(255,255,255,.6);font-size:13px;">将来の資産総額</p>
  <div class="result-big" id="future">—</div>
  <div class="result-row">
    <div class="result-item">
      <p>元本合計</p>
      <span id="principal">—</span>
    </div>
    <div class="result-item">
      <p>運用益</p>
      <span id="profit">—</span>
    </div>
  </div>
  <p class="msg" id="message"></p>
</div>

<canvas id="chart"></canvas>

<!-- 資産・税務・健康 診断 -->
<div class="card">
  <h2>🏦 資産・税務・健康 総合診断</h2>

  <label>年収（円）</label>
  <input type="number" id="income" value="6000000">

  <label>総資産（円）</label>
  <input type="number" id="assets" value="10000000">

  <label>年間税金＋社会保険料（円）</label>
  <input type="number" id="tax" value="1000000">

  <label>健康状態</label>
  <select id="health">
    <option value="good">良好</option>
    <option value="normal">普通</option>
    <option value="bad">不安あり</option>
  </select>

  <button onclick="diagnose()">診断する</button>

  <hr>

  <div class="ratio-row">
    <div class="ratio-item">
      <p>資産÷年収</p>
      <span id="ratio1">—</span>
    </div>
    <div class="ratio-item">
      <p>税負担÷資産</p>
      <span id="ratio2">—</span>
    </div>
    <div class="ratio-item">
      <p>税負担÷年収</p>
      <span id="ratio3">—</span>
    </div>
  </div>

  <p style="font-size:13px;color:rgba(255,255,255,.6);margin-top:8px;">総合スコア</p>
  <div class="total-score" id="totalScore">—</div>

  <div class="score-box">
    <div class="score-item">
      <p>資産スコア</p>
      <span id="assetScoreVal">—</span>
    </div>
    <div class="score-item">
      <p>税務スコア</p>
      <span id="taxScoreVal">—</span>
    </div>
    <div class="score-item">
      <p>健康スコア</p>
      <span id="healthScoreVal">—</span>
    </div>
  </div>

  <div class="comment" id="scoreComment"></div>
  <div class="comment" id="advice"></div>

  <button class="btn-line" onclick="goLine()">無料で詳細プランを受け取る（LINE）</button>
</div>

<!-- お問い合わせ -->
<div class="card">
  <h2>📩 無料相談のお申し込み</h2>

  <label>お名前</label>
  <input type="text" id="cf-name" placeholder="（削除済み） （削除済み）">

  <label>電話番号</label>
  <input type="text" id="cf-tel" placeholder="090-0000-0000">

  <label>メールアドレス</label>
  <input type="email" id="cf-email" placeholder="example@email.com">

  <label>ご相談内容</label>
  <select id="cf-type">
    <option value="">選択してください</option>
    <option>資産運用・NISA</option>
    <option>ライフプラン設計</option>
    <option>相続・事業承継</option>
    <option>個人融資サポート</option>
    <option>その他</option>
  </select>

  <label>メッセージ</label>
  <textarea id="cf-msg" rows="4" placeholder="ご質問・ご要望をご記入ください"
    style="width:100%;padding:10px;margin-top:4px;background:#0b1c2c;border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:14px;resize:vertical;"></textarea>

  <button onclick="sendForm()">送信する</button>
  <p id="form-msg" style="text-align:center;margin-top:10px;font-size:14px;"></p>
</div>

</div><!-- /container -->

<div class="fixed-line">
  <a href="#" onclick="goLine();return false;">📲 LINEで無料相談する</a>
</div>

<script>
/* ===== NISA シミュレーター ===== */
let nisaChart;

function calc() {
  const m    = Number(document.getElementById('monthly').value);
  const init = Number(document.getElementById('initial').value);
  const r    = Number(document.getElementById('rate').value) / 100;
  const y    = Number(document.getElementById('years').value);
  const inf  = document.getElementById('inflation').checked ? 0.02 : 0;

  const monthlyRate = (r - inf) / 12;
  let total = init;
  const data = [];

  for (let n = 1; n <= y * 12; n++) {
    total = total * (1 + monthlyRate) + m;
    if (n % 12 === 0) data.push(Math.round(total));
  }

  const principal = init + m * y * 12;
  const profit    = total - principal;

  document.getElementById('future').textContent    = fmt(total) + ' 円';
  document.getElementById('principal').textContent = fmt(principal) + ' 円';
  document.getElementById('profit').textContent    = fmt(profit) + ' 円';
  document.getElementById('message').textContent   =
    total > 20000000 ? '✅ 順調です。このまま継続しましょう！'
                     : '⚠️ 対策が必要です。早めの行動が重要です。';

  drawChart(data, y);
}

function drawChart(data, years) {
  const ctx = document.getElementById('chart');
  if (nisaChart) nisaChart.destroy();
  nisaChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map((_, i) => (i + 1) + '年'),
      datasets: [{
        label: '資産推移（円）',
        data: data,
        borderColor: 'gold',
        backgroundColor: 'rgba(255,215,0,.12)',
        borderWidth: 2,
        pointRadius: 2,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#fff' } } },
      scales: {
        x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,.08)' } },
        y: {
          ticks: { color: '#aaa', callback: v => (v / 10000).toLocaleString() + '万' },
          grid: { color: 'rgba(255,255,255,.08)' }
        }
      }
    }
  });
}

/* ===== 総合診断 ===== */
function diagnose() {
  const incomeVal = Number(document.getElementById('income').value);
  const assetsVal = Number(document.getElementById('assets').value);
  const taxVal    = Number(document.getElementById('tax').value);
  const healthVal = document.getElementById('health').value;

  const r1 = assetsVal / incomeVal;
  const r2 = taxVal / assetsVal;
  const r3 = taxVal / incomeVal;

  document.getElementById('ratio1').textContent = r1.toFixed(2) + ' 倍';
  document.getElementById('ratio2').textContent = (r2 * 100).toFixed(1) + '%';
  document.getElementById('ratio3').textContent = (r3 * 100).toFixed(1) + '%';

  const aScore = r1 >= 3 ? 40 : r1 >= 1 ? 25 : 10;
  const tScore = r3 <= 0.20 ? 30 : r3 <= 0.25 ? 20 : 10;
  const hScore = healthVal === 'good' ? 30 : healthVal === 'normal' ? 20 : 10;
  const total  = aScore + tScore + hScore;

  document.getElementById('totalScore').textContent    = total + ' 点 / 100点';
  document.getElementById('assetScoreVal').textContent  = aScore;
  document.getElementById('taxScoreVal').textContent    = tScore;
  document.getElementById('healthScoreVal').textContent = hScore;

  document.getElementById('scoreComment').textContent =
    total >= 80 ? '◎ 非常に良好な状態です！この調子で継続しましょう。' :
    total >= 60 ? '○ 平均的な状態です。いくつか改善できる余地があります。' :
                  '△ 改善が必要です。早めに専門家にご相談ください。';

  document.getElementById('advice').textContent =
    '今から対策することで、将来の資産を大きく改善できます。無料相談でプロがアドバイスします。';
}

/* ===== お問い合わせ送信 ===== */
const GAS_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // ← GASのURLに変更

async function sendForm() {
  const msgEl = document.getElementById('form-msg');
  const body = {
    name:  document.getElementById('cf-name').value,
    tel:   document.getElementById('cf-tel').value,
    email: document.getElementById('cf-email').value,
    type:  document.getElementById('cf-type').value,
    memo:  document.getElementById('cf-msg').value
  };

  if (!body.name || !body.email) {
    msgEl.style.color = '#ff7070';
    msgEl.textContent = 'お名前とメールアドレスを入力してください。';
    return;
  }

  msgEl.style.color = '#aaa';
  msgEl.textContent = '送信中...';

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    msgEl.style.color = '#5cd65c';
    msgEl.textContent = '✅ 送信完了！2〜3営業日以内にご連絡いたします。';
  } catch (e) {
    msgEl.style.color = '#ff7070';
    msgEl.textContent = '送信エラー。お電話にてご連絡ください。';
  }
}

/* ===== LINE ===== */
function goLine() {
  window.location.href = 'https://line.me/your-link'; // ← LINEのURLに変更
}

/* 初回実行 */
calc();
</script>
</body>
</html>
