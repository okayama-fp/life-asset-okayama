name: 毎日自動ブログ投稿

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 22:00 UTC = 翌朝 7:00 JST
  workflow_dispatch:         # 手動実行ボタン（テスト用）

permissions:
  contents: write

jobs:
  post-article:
    runs-on: ubuntu-latest

    steps:
      - name: gh-pages をチェックアウト
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install google-genai feedparser requests pytz

      - name: 記事を生成
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "Life Asset Bot"
          git config user.email "yamakaze8000@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "自動投稿：${{ steps.gen.outputs.date }} ${{ steps.gen.outputs.title }}"
          git push

      - name: Xに自動ポスト
        if: success()
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          pip install tweepy -q
          python scripts/post_to_x.py "${{ steps.gen.outputs.title }}" "${{ steps.gen.outputs.filename }}" "${{ steps.gen.outputs.category }}"

      - name: 投稿完了メール通知（note下書き付き）
        if: success()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_MODE: success
          MAIL_TITLE: ${{ steps.gen.outputs.title }}
          MAIL_CATEGORY: ${{ steps.gen.outputs.category }}
          MAIL_FILENAME: ${{ steps.gen.outputs.filename }}
          MAIL_DATE: ${{ steps.gen.outputs.date }}
          MAIL_NOTE_TYPE: ${{ steps.gen.outputs.note_type }}
        run: python scripts/send_email.py

      - name: 失敗時メール通知
        if: failure()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_MODE: failure
        run: python scripts/send_email.py
