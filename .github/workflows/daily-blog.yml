name: 毎日自動ブログ投稿

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 22:00 UTC = 翌朝 7:00 JST
  workflow_dispatch:         # 手動実行ボタン（テスト用）

permissions:
  contents: write

jobs:
  post-article:
    runs-on: ubuntu-latest

    steps:
      - name: gh-pages をチェックアウト
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install google-genai feedparser requests pytz

      - name: 記事を生成
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "Life Asset Bot"
          git config user.email "yamakaze8000@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "自動投稿：${{ steps.gen.outputs.date }} ${{ steps.gen.outputs.title }}"
          git push

      - name: note下書き本文を読み込み
        id: note
        if: success()
        run: |
          NOTE_BODY=$(cat note_draft_for_email.txt 2>/dev/null || echo "（生成に失敗しました）")
          echo "note_body<<NOTE_EOF" >> $GITHUB_OUTPUT
          echo "$NOTE_BODY" >> $GITHUB_OUTPUT
          echo "NOTE_EOF" >> $GITHUB_OUTPUT

      - name: 投稿完了メール通知（note下書き付き）
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ [${{ steps.gen.outputs.note_type }}] note下書き + ブログ自動投稿 [${{ steps.gen.outputs.date }}]"
          to: yamakaze8000@gmail.com
          from: "ライフアセット自動投稿 <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📝 note記事（${{ steps.gen.outputs.note_type }}）下書き
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            ↓↓ 以下をnoteにコピー＆ペーストしてください ↓↓

            ${{ steps.note.outputs.note_body }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📰 ブログ自動投稿 完了
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            ■ タイトル：${{ steps.gen.outputs.title }}
            ■ カテゴリ：${{ steps.gen.outputs.category }}
            ■ 投稿日時：${{ steps.gen.outputs.date }} 07:00 JST
            ■ ブログURL：https://lifeassetoffice.net/blog/${{ steps.gen.outputs.filename }}
            ■ note管理：https://note.com/lifeasset_fp

            ─────────────────────
            ライフアセットパートナーズ 自動投稿システム

      - name: 失敗時メール通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⚠️ ブログ自動投稿が失敗しました [${{ steps.gen.outputs.date }}]"
          to: yamakaze8000@gmail.com
          from: "ライフアセット自動投稿 <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            本日の自動投稿でエラーが発生しました。

            GitHub Actions のログを確認してください：
            https://github.com/okayama-fp/life-asset-okayama/actions

            ─────────────────────
            ライフアセットパートナーズ 自動投稿システム
