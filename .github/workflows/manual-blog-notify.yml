name: 手動記事：X自動投稿 + note下書きメール

on:
  push:
    branches: [gh-pages]
    paths: ['blog/post-*.html']

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: gh-pages をチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 新規 post-*.html を検出
        run: |
          git diff HEAD~1 HEAD --name-only --diff-filter=A \
            | grep 'blog/post-.*\.html' > new_posts.txt || true
          echo "=== 新規記事 ==="
          cat new_posts.txt

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install google-genai beautifulsoup4 tweepy

      - name: X投稿 + note下書き生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/notify_manual_post.py

      - name: note下書きをメール通知
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_MODE: manual_success
        run: python scripts/send_email.py

      - name: 失敗時メール通知
        if: failure()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_MODE: manual_failure
        run: python scripts/send_email.py
