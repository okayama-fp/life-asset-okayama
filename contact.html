<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://lifeassetoffice.net/contact.html">
  <title>お問い合わせ｜ライフアセットオフィス</title>
  <meta name="description" content="ライフアセットオフィスへのお問い合わせページ。資産運用・家計相談・融資サポートについてお気軽にご連絡ください。">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--sky:#1a7a4a;--sky-light:#22c55e;--navy:#1a3d2b;--text:#1e293b;--text-sub:#64748b;--border:#e2e8f0;--bg:#f8fafc}
    body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);line-height:1.8}
    a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
    .header-inner{max-width:1100px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:24px}
    .logo-main{font-size:1.3rem;font-weight:900;background:linear-gradient(90deg,#1a7a4a,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    nav{display:flex;gap:20px;margin-left:auto}
    nav a{font-size:13px;color:var(--text-sub);font-weight:500;transition:color .2s}
    nav a:hover{color:var(--sky)}
    .hero{background:linear-gradient(135deg,#dcfce7,#f0fdf4);padding:56px 24px;text-align:center}
    .hero h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;color:var(--navy);margin-bottom:12px}
    .hero p{font-size:1rem;color:var(--text-sub)}
    .page-wrap{max-width:680px;margin:0 auto;padding:48px 24px 80px}
    .contact-card{background:#fff;border-radius:20px;border:1px solid var(--border);padding:36px;margin-bottom:24px;box-shadow:0 4px 20px rgba(26,122,74,0.07)}
    .contact-card h2{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .contact-card p{font-size:0.9rem;color:var(--text-sub);margin-bottom:20px;line-height:1.7}
    .btn-contact{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--sky),var(--sky-light));color:#fff;font-size:0.95rem;font-weight:700;padding:14px 32px;border-radius:50px;box-shadow:0 4px 14px rgba(26,122,74,0.3);transition:opacity .2s,transform .15s;cursor:pointer;border:none;font-family:inherit;width:100%;justify-content:center}
    .btn-contact:hover{opacity:.88;transform:translateY(-1px)}
    .info-grid{display:grid;gap:16px;margin-top:32px}
    .info-item{background:#f0fdf4;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px}
    .info-icon{font-size:1.4rem;flex-shrink:0}
    .info-text .label{font-size:0.78rem;color:var(--text-sub);font-weight:600;margin-bottom:2px}
    .info-text .value{font-size:0.95rem;font-weight:700;color:var(--navy)}
    .note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px 18px;font-size:0.85rem;color:#92400e;margin-top:24px;line-height:1.7}
    footer{background:var(--navy);color:rgba(255,255,255,0.8);text-align:center;padding:32px 24px;font-size:0.8rem}
    footer a{color:#22c55e;text-decoration:underline}
    /* CONTACT FORM */
    .contact-form{display:grid;gap:16px;margin-top:8px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:0.85rem;font-weight:600;color:var(--navy)}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:0.9rem;font-family:inherit;color:var(--text);transition:border-color .2s;background:#fff}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(26,122,74,0.1)}
    .form-group textarea{resize:vertical;min-height:120px}
    /* honeypot: 人間には見えない、ボットが記入する */
    .hp-field{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden;pointer-events:none;tab-index:-1}
    .cf-turnstile { margin-top: 8px; }
  </style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1266918303152498"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html"><span class="logo-main">Life Asset</span></a>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="blog/index.html">ブログ</a>
      <a href="contact.html" style="color:var(--sky)">お問い合わせ</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="hero">
  <h1>お問い合わせ</h1>
  <p>資産運用・家計相談・融資サポートについて、お気軽にご連絡ください</p>
</div>

<div class="page-wrap">

  <div class="contact-card">
    <h2>お問い合わせフォーム</h2>
    <p>下記フォームにご記入の上、送信してください。通常3〜5営業日以内にご返信いたします。</p>
    <form class="contact-form" id="contact-form" onsubmit="return handleSubmit(event)">
      <!-- honeypot: ボット対策（人間には非表示） -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Website（入力しないでください）</label>
        <input type="text" id="website" name="website" autocomplete="off" tabindex="-1">
        <input type="text" id="phone2" name="phone2" autocomplete="off" tabindex="-1">
        <input type="email" id="email2" name="email2" autocomplete="off" tabindex="-1">
      </div>
      <input type="hidden" id="form-load-time" name="load_time">
      <div class="form-group">
        <label for="contact-name">お名前 <span style="color:#e11d48">*</span></label>
        <input type="text" id="contact-name" name="name" placeholder="例：山田 太郎" required>
      </div>
      <div class="form-group">
        <label for="contact-email-input">メールアドレス <span style="color:#e11d48">*</span></label>
        <input type="email" id="contact-email-input" name="email" placeholder="例：example@mail.com" required>
      </div>
      <div class="form-group">
        <label for="contact-subject">ご相談内容</label>
        <select id="contact-subject" name="subject">
          <option value="">選択してください</option>
          <option value="資産運用">資産運用</option>
          <option value="家計管理">家計管理</option>
          <option value="老後資金">老後資金・年金</option>
          <option value="保険">保険の見直し</option>
          <option value="融資">融資・ローン</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label for="contact-message">メッセージ <span style="color:#e11d48">*</span></label>
        <textarea id="contact-message" name="message" placeholder="ご相談内容を自由にご記入ください" required></textarea>
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADZkg2tGLOTSIha4" data-theme="light"></div>
      <button type="submit" class="btn-contact">メールで送信する</button>
    </form>
  </div>

  <div class="info-grid">
    <div class="info-item">
      
      <div class="info-text">
        <div class="label">メールアドレス</div>
        <div class="value" id="contact-email"></div>
        <script>(function(){var p='info',d='lifeassetoffice.net';document.getElementById('contact-email').textContent=p+'@'+d;})();</script>
      </div>
    </div>
    <div class="info-item">
      
      <div class="info-text">
        <div class="label">返信目安</div>
        <div class="value">3〜5営業日以内</div>
      </div>
    </div>
    <div class="info-item">
      
      <div class="info-text">
        <div class="label">相談内容の例</div>
        <div class="value">資産運用・家計管理・老後資金・保険・融資</div>
      </div>
    </div>
  </div>

  <div class="note">
    💡 <strong>ご相談の際のポイント：</strong><br>
    年齢・家族構成・現在の状況・ご希望をお知らせいただくと、より具体的なアドバイスが可能です。秘密は厳守いたします。
  </div>

</div>

<footer>
  <p>© 2026 ライフアセットオフィス｜<a href="privacy.html">プライバシーポリシー</a>｜<a href="contact.html">お問い合わせ</a></p>
</footer>

<script>
  // フォーム表示時刻を記録
  document.getElementById('form-load-time').value = Date.now();

  // 連続送信ブロック用
  var lastSubmit = 0;

  function handleSubmit(e) {
    e.preventDefault();

    // ハニーポットチェック
    if (document.getElementById('website').value !== '' ||
        document.getElementById('phone2').value !== '' ||
        document.getElementById('email2').value !== '') {
      return false;
    }

    // 送信速度チェック（3秒未満 = ボット疑い）
    var loadTime = parseInt(document.getElementById('form-load-time').value, 10);
    if (Date.now() - loadTime < 3000) {
      return false;
    }

    // Turnstile チェック
    var tsToken = document.querySelector('[name="cf-turnstile-response"]');
    if (!tsToken || !tsToken.value) {
      alert('BOT確認を完了してください。');
      return false;
    }

    // 連続送信ブロック（30秒以内の再送信を拒否）
    var now = Date.now();
    if (now - lastSubmit < 30000) {
      alert('送信が完了しています。しばらくお待ちください。');
      return false;
    }
    lastSubmit = now;

    var name    = document.getElementById('contact-name').value.trim();
    var email   = document.getElementById('contact-email-input').value.trim();
    var subject = document.getElementById('contact-subject').value;
    var message = document.getElementById('contact-message').value.trim();
    var subj = encodeURIComponent('ライフアセットオフィスへのお問い合わせ' + (subject ? '【' + subject + '】' : ''));
    var body = encodeURIComponent('お名前：' + name + '\n返信先：' + email + '\nご相談内容：' + subject + '\n\n' + message);
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=info%40lifeassetoffice.net&su=' + subj + '&body=' + body, '_blank', 'noopener,noreferrer');
    return false;
  }
</script>
<script src="/nav.js" defer></script>
</body>
</html>
