<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>🐊 ワニから逃げろ！</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#1a3a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Hiragino Kaku Gothic ProN',sans-serif;user-select:none;overflow:hidden;}
  h1{color:#7ddd7d;font-size:20px;margin-bottom:8px;letter-spacing:2px;text-shadow:0 0 12px #4ab84a;}
  #ui{display:flex;gap:20px;margin-bottom:8px;}
  .ui-box{background:rgba(0,0,0,0.4);border:1px solid #4a8a4a;border-radius:10px;padding:6px 18px;text-align:center;}
  .ui-label{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;}
  .ui-val{font-size:22px;font-weight:900;color:#7ddd7d;}
  #canvas{border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.6);touch-action:none;}
  /* dpad */
  #dpad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:4px;margin-top:12px;}
  .dpad-btn{background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;color:#fff;transition:background .1s;-webkit-tap-highlight-color:transparent;}
  .dpad-btn:active,.dpad-btn.pressed{background:rgba(125,221,125,0.35);border-color:#7ddd7d;}
  .dpad-empty{pointer-events:none;}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.88);color:#fff;padding:28px 48px;border-radius:20px;display:none;text-align:center;z-index:10;border:2px solid #4a8a4a;}
  #start-btn{margin-top:16px;background:linear-gradient(135deg,#4a8a4a,#2a6a2a);color:#fff;border:none;padding:14px 48px;border-radius:32px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:2px;}
  #start-btn:hover{opacity:0.9;}
  #lives{font-size:22px;letter-spacing:4px;}
</style>
</head>
<body>
<h1>🐊 ワニから逃げろ！</h1>
<div id="ui">
  <div class="ui-box"><div class="ui-label">TIME</div><div class="ui-val" id="time">0</div></div>
  <div class="ui-box"><div class="ui-label">BEST</div><div class="ui-val" id="best">0</div></div>
  <div class="ui-box"><div class="ui-label">LIFE</div><div id="lives">❤️❤️❤️</div></div>
</div>
<canvas id="canvas" width="360" height="440"></canvas>
<div id="dpad">
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="up">▲</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="left">◀</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="right">▶</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="down">▼</div>
  <div class="dpad-empty"></div>
</div>

<div id="msg">
  <div id="msg-text">🐊 ワニから逃げろ！<br><span style="font-size:13px;color:rgba(255,255,255,0.6)">捕まると残機が減るよ！<br>アイテムを集めて生き残れ！</span></div>
  <br>
  <button id="start-btn" onclick="startGame()">▶ スタート</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- State ---
let player, crocs, items, particles, score, best=0, lives, gameActive, animId, lastTime, invincible, invTimer;
const keys = {up:false, down:false, left:false, right:false};

// dpad buttons
['up','down','left','right'].forEach(d => {
  const btn = document.getElementById(d);
  const press = () => { keys[d]=true; btn.classList.add('pressed'); };
  const release = () => { keys[d]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchstart', e=>{e.preventDefault();press();},{passive:false});
  btn.addEventListener('mouseup', release);
  btn.addEventListener('touchend', e=>{e.preventDefault();release();},{passive:false});
  btn.addEventListener('mouseleave', release);
  btn.addEventListener('touchcancel', release);
});

// keyboard
document.addEventListener('keydown', e => {
  if(e.key==='ArrowUp'||e.key==='w') keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s') keys.down=true;
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
});
document.addEventListener('keyup', e => {
  if(e.key==='ArrowUp'||e.key==='w') keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s') keys.down=false;
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
});

// --- Items ---
const ITEM_TYPES = [
  {emoji:'⭐', effect:'speed', label:'スピードアップ!', color:'#ffe066'},
  {emoji:'🛡️', effect:'shield', label:'無敵!', color:'#66aaff'},
  {emoji:'❤️', effect:'life', label:'ライフ+1!', color:'#ff6666'},
  {emoji:'💨', effect:'freeze', label:'ワニ凍結!', color:'#aaffff'},
];

function spawnItem() {
  const t = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
  return {x:40+Math.random()*(W-80), y:40+Math.random()*(H-80), type:t, r:16, pulse:0, alive:true};
}

// --- Crocodile AI ---
function spawnCroc(difficulty) {
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-30;}
  else if(side===1){x=W+30;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H+30;}
  else{x=-30;y=Math.random()*H;}
  const spd = 1.2 + difficulty*0.25 + Math.random()*0.5;
  return {x,y,vx:0,vy:0,speed:spd,angle:0,frozen:0,size:28};
}

function updateCroc(c, px, py, dt) {
  if(c.frozen > 0){ c.frozen -= dt; return; }
  const dx = px - c.x, dy = py - c.y;
  const dist = Math.hypot(dx,dy)||1;
  c.vx += (dx/dist*c.speed - c.vx) * 0.08;
  c.vy += (dy/dist*c.speed - c.vy) * 0.08;
  c.x += c.vx * dt;
  c.y += c.vy * dt;
  c.angle = Math.atan2(dy, dx);
}

// --- Particles ---
function addParticles(x, y, color, n=10) {
  for(let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, spd = 2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,alpha:1,color,r:4+Math.random()*4});
  }
}

// --- Draw ---
function drawBackground() {
  // grass
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a5a2a');
  bg.addColorStop(1,'#1a4a1a');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(0,0,W,H,16); ctx.fill();

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for(let x=20;x<W;x+=40) for(let y=20;y<H;y+=40) {
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  }
}

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if(invincible && Math.floor(Date.now()/80)%2===0) {ctx.restore();return;}

  // shadow
  ctx.beginPath(); ctx.ellipse(0,10,14,6,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();

  // body circle
  const grad = ctx.createRadialGradient(-8,-8,2,0,0,22);
  grad.addColorStop(0,'#ffe0a0'); grad.addColorStop(1,'#e8a060');
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();

  // shield ring
  if(p.shield) {
    ctx.beginPath(); ctx.arc(0,0,23,0,Math.PI*2);
    ctx.strokeStyle='rgba(100,170,255,0.8)'; ctx.lineWidth=3; ctx.stroke();
  }

  // face
  ctx.font='28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧑', 0, 2);

  // speed trail
  if(p.speed>1) {
    ctx.globalAlpha=0.3;
    ctx.font='16px serif';
    ctx.fillText('💨',-24,0);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawCroc(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);

  // frozen tint
  if(c.frozen>0) {
    ctx.globalAlpha=0.6;
  }

  // shadow
  ctx.beginPath(); ctx.ellipse(0,6,c.size*0.9,c.size*0.4,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fill();

  // body
  const grad = ctx.createRadialGradient(-8,-6,2,0,0,c.size);
  grad.addColorStop(0,'#7acc5a'); grad.addColorStop(1,'#3a8a2a');
  ctx.beginPath(); ctx.arc(0,0,c.size,0,Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();

  // frozen overlay
  if(c.frozen>0) {
    ctx.beginPath(); ctx.arc(0,0,c.size,0,Math.PI*2);
    ctx.fillStyle='rgba(150,220,255,0.4)'; ctx.fill();
  }

  ctx.font=`${c.size*1.6}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🐊',0,2);

  ctx.restore();
}

function drawItem(it) {
  it.pulse = (it.pulse||0) + 0.08;
  const s = 1 + Math.sin(it.pulse)*0.12;
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.scale(s,s);
  ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2);
  ctx.fillStyle=it.type.color+'44'; ctx.fill();
  ctx.strokeStyle=it.type.color; ctx.lineWidth=2; ctx.stroke();
  ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(it.type.emoji,0,2);
  ctx.restore();
}

function drawParticles() {
  particles = particles.filter(p=>p.alpha>0.05);
  for(const p of particles) {
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.alpha-=0.03;
    ctx.save(); ctx.globalAlpha=p.alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    ctx.restore();
  }
}

let floatTexts=[];
function showFloat(x,y,text,color) {
  floatTexts.push({x,y,text,color,alpha:1,vy:-1.5});
}
function drawFloatTexts() {
  floatTexts=floatTexts.filter(t=>t.alpha>0.05);
  for(const t of floatTexts) {
    t.y+=t.vy; t.alpha-=0.02;
    ctx.save(); ctx.globalAlpha=t.alpha;
    ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle=t.color; ctx.fillText(t.text,t.x,t.y);
    ctx.restore();
  }
}

// --- Game loop ---
let difficulty=0, spawnTimer=0, itemTimer=0, elapsed=0;
let speedActive=0, freezeActive=0;

function startGame() {
  document.getElementById('msg').style.display='none';
  player = {x:W/2, y:H/2, vx:0, vy:0, speed:2.8, shield:false};
  crocs=[]; items=[]; particles=[]; floatTexts=[];
  lives=3; score=0; difficulty=0; elapsed=0;
  spawnTimer=0; itemTimer=0; invincible=false; invTimer=0;
  speedActive=0; freezeActive=0;
  updateLives();
  document.getElementById('time').textContent='0';
  gameActive=true;
  lastTime=performance.now();
  crocs.push(spawnCroc(0));
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function loop(ts) {
  const dt = Math.min((ts-lastTime)/16, 3);
  lastTime=ts;
  if(!gameActive) return;
  update(dt);
  render();
  animId=requestAnimationFrame(loop);
}

function update(dt) {
  elapsed += dt/60;
  score = Math.floor(elapsed);
  difficulty = Math.floor(elapsed/10);
  document.getElementById('time').textContent = score;

  // invincible
  if(invincible) { invTimer-=dt; if(invTimer<=0) invincible=false; }

  // speed effect
  if(speedActive>0) speedActive-=dt;
  if(freezeActive>0) { freezeActive-=dt; crocs.forEach(c=>c.frozen=Math.max(c.frozen,freezeActive)); }

  // player movement
  const spd = (speedActive>0?5:2.8) * dt;
  if(keys.up) player.vy -= 0.6*dt;
  if(keys.down) player.vy += 0.6*dt;
  if(keys.left) player.vx -= 0.6*dt;
  if(keys.right) player.vx += 0.6*dt;
  player.vx *= 0.82; player.vy *= 0.82;
  const mv = Math.hypot(player.vx,player.vy);
  if(mv>spd){player.vx=player.vx/mv*spd;player.vy=player.vy/mv*spd;}
  player.x = Math.max(20, Math.min(W-20, player.x+player.vx));
  player.y = Math.max(20, Math.min(H-20, player.y+player.vy));

  // spawn crocs
  spawnTimer-=dt;
  if(spawnTimer<=0) {
    crocs.push(spawnCroc(difficulty));
    spawnTimer = Math.max(80-difficulty*8, 30);
  }

  // spawn items
  itemTimer-=dt;
  if(itemTimer<=0 && items.length<3) {
    items.push(spawnItem());
    itemTimer = 120+Math.random()*120;
  }

  // update crocs
  for(const c of crocs) updateCroc(c, player.x, player.y, dt);

  // collision: crocs
  if(!invincible) {
    for(const c of crocs) {
      if(Math.hypot(c.x-player.x, c.y-player.y) < 26) {
        if(player.shield) {
          player.shield=false;
          addParticles(player.x,player.y,'#66aaff',12);
          showFloat(player.x,player.y-30,'シールド消えた!','#66aaff');
          invincible=true; invTimer=60;
        } else {
          loseLife();
        }
        break;
      }
    }
  }

  // collision: items
  for(const it of items) {
    if(!it.alive) continue;
    if(Math.hypot(it.x-player.x, it.y-player.y)<28) {
      it.alive=false;
      applyItem(it.type);
      addParticles(it.x,it.y,it.type.color,8);
      showFloat(it.x,it.y-30,it.type.label,it.type.color);
    }
  }
  items=items.filter(i=>i.alive);

  // remove off-screen crocs (if too far)
  crocs=crocs.filter(c=>!(Math.hypot(c.x-player.x,c.y-player.y)>800));
}

function applyItem(type) {
  if(type.effect==='speed') speedActive=200;
  if(type.effect==='shield') player.shield=true;
  if(type.effect==='life' && lives<5) { lives++; updateLives(); }
  if(type.effect==='freeze') { freezeActive=180; crocs.forEach(c=>c.frozen=180); }
}

function loseLife() {
  addParticles(player.x, player.y, '#ff6666', 16);
  showFloat(player.x, player.y-40, 'やられた！', '#ff4444');
  lives--;
  updateLives();
  invincible=true; invTimer=90;
  if(lives<=0) endGame();
}

function updateLives() {
  document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0,lives));
}

function endGame() {
  gameActive=false;
  if(score>best){best=score;document.getElementById('best').textContent=best;}
  const msg=document.getElementById('msg');
  document.getElementById('msg-text').innerHTML=`🐊 捕まった！<br><span style="font-size:40px;color:#7ddd7d">${score}秒</span><br><span style="font-size:13px;color:rgba(255,255,255,0.6)">ベスト: ${best}秒</span>`;
  msg.style.display='block';
}

function render() {
  drawBackground();
  items.forEach(drawItem);
  crocs.forEach(drawCroc);
  drawPlayer(player);
  drawParticles();
  drawFloatTexts();

  // speed overlay
  if(speedActive>0) {
    ctx.save(); ctx.globalAlpha=0.12;
    ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.roundRect(0,0,W,H,16); ctx.fill();
    ctx.restore();
  }
}

// init display
document.getElementById('msg').style.display='block';
</script>
</body>
</html>
