<svg width="220" height="240" viewBox="0 0 120 180" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:linear-gradient(135deg,#d4eef4,#e8f7f7); border-radius:24px;">
  <!-- shadow -->
  <ellipse cx="60" cy="158" rx="30" ry="6" fill="#4ab8b8" opacity="0.15"/>
  <!-- body -->
  <ellipse cx="60" cy="108" rx="36" ry="44" fill="#4ab8b8"/>
  <ellipse cx="60" cy="108" rx="36" ry="44" fill="url(#bodyGrad)"/>
  <!-- belly -->
  <ellipse cx="60" cy="114" rx="22" ry="30" fill="white" opacity="0.92"/>
  <!-- head -->
  <ellipse cx="60" cy="64" rx="26" ry="25" fill="#4ab8b8"/>
  <ellipse cx="60" cy="64" rx="26" ry="25" fill="url(#headGrad)"/>
  <!-- face white -->
  <ellipse cx="60" cy="68" rx="18" ry="18" fill="white" opacity="0.92"/>
  <!-- left eye -->
  <circle cx="52" cy="62" r="5" fill="#2e9090"/>
  <circle cx="53.5" cy="61" r="2.5" fill="white"/>
  <!-- right eye -->
  <circle cx="68" cy="62" r="5" fill="#2e9090"/>
  <circle cx="69.5" cy="61" r="2.5" fill="white"/>
  <!-- smile -->
  <path d="M53 73 Q60 79 67 73" stroke="#4ab8b8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- beak -->
  <ellipse cx="60" cy="71" rx="6" ry="3.5" fill="#f5c842"/>
  <!-- cheeks -->
  <ellipse cx="44" cy="71" rx="6" ry="4" fill="#a8e6e6" opacity="0.6"/>
  <ellipse cx="76" cy="71" rx="6" ry="4" fill="#a8e6e6" opacity="0.6"/>
  <!-- left wing -->
  <ellipse cx="24" cy="111" rx="10" ry="24" fill="#2e9090" opacity="0.85" transform="rotate(-12 24 111)"/>
  <!-- right wing waving -->
  <ellipse cx="96" cy="103" rx="10" ry="24" fill="#2e9090" opacity="0.85" transform="rotate(30 96 103)"/>
  <!-- left foot -->
  <ellipse cx="46" cy="150" rx="12" ry="5" fill="#f5c842"/>
  <!-- right foot -->
  <ellipse cx="72" cy="150" rx="12" ry="5" fill="#f5c842"/>
  <!-- hat brim -->
  <ellipse cx="60" cy="42" rx="30" ry="5" fill="#2e9090"/>
  <!-- hat body -->
  <rect x="42" y="20" width="36" height="24" rx="5" fill="#2e9090"/>
  <!-- hat band -->
  <rect x="42" y="38" width="36" height="5" rx="2" fill="white" opacity="0.5"/>
  <!-- hat dot -->
  <circle cx="60" cy="28" r="3" fill="white" opacity="0.4"/>
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2e9090" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2e9090" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
</svg>
