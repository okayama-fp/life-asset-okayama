<svg width="200" height="260" viewBox="0 0 110 160" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#e8f7f7; border-radius:20px; padding:10px;">
  <!-- body -->
  <ellipse cx="55" cy="90" rx="38" ry="46" fill="#1a3a5c"/>
  <!-- belly -->
  <ellipse cx="55" cy="95" rx="24" ry="32" fill="#e8f7f7"/>
  <!-- face -->
  <ellipse cx="55" cy="52" rx="28" ry="27" fill="#1a3a5c"/>
  <!-- face white -->
  <ellipse cx="55" cy="55" rx="20" ry="20" fill="#e8f7f7"/>
  <!-- left eye -->
  <circle cx="47" cy="49" r="5" fill="white"/>
  <circle cx="48.5" cy="49" r="3" fill="#1a3a5c"/>
  <circle cx="49.5" cy="47.5" r="1" fill="white"/>
  <!-- right eye -->
  <circle cx="63" cy="49" r="5" fill="white"/>
  <circle cx="64.5" cy="49" r="3" fill="#1a3a5c"/>
  <circle cx="65.5" cy="47.5" r="1" fill="white"/>
  <!-- beak -->
  <ellipse cx="55" cy="60" rx="7" ry="4.5" fill="#f0a830"/>
  <line x1="48" y1="60" x2="62" y2="60" stroke="#d4902a" stroke-width="1.2"/>
  <!-- left wing -->
  <ellipse cx="20" cy="95" rx="11" ry="26" fill="#1a3a5c" transform="rotate(-15 20 95)"/>
  <!-- right wing -->
  <ellipse cx="90" cy="95" rx="11" ry="26" fill="#1a3a5c" transform="rotate(15 90 95)"/>
  <!-- left foot -->
  <ellipse cx="42" cy="133" rx="13" ry="6" fill="#f0a830"/>
  <!-- right foot -->
  <ellipse cx="68" cy="133" rx="13" ry="6" fill="#f0a830"/>
  <!-- scarf -->
  <rect x="28" y="72" width="54" height="10" rx="5" fill="#4ab8b8"/>
  <rect x="50" y="80" width="12" height="18" rx="4" fill="#4ab8b8"/>
  <!-- cheeks -->
  <ellipse cx="41" cy="60" rx="6" ry="4" fill="#f9b8c0" opacity="0.5"/>
  <ellipse cx="69" cy="60" rx="6" ry="4" fill="#f9b8c0" opacity="0.5"/>
</svg>
